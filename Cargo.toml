[package]
name = "tivan"
version = "0.1.0"
edition = "2024"

[features]
default = []
web = ["dioxus/web"]

[dependencies]
dioxus = { version = "=0.7.10" }
gloo-timers = { version = "0.3.0", features = ["futures"] }
js-sys = "0.3.106"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "AbortSignal",
    "Headers",
    "History",
    "KeyboardEvent",
    "Location",
    "RequestCache",
    "RequestInit",
    "Response",
    "Storage",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
